<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Asteroid Game - Void Navigator</title>
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <style>
      html, body { 
        margin: 0; 
        padding: 0;
        height: 100%; 
        overflow: hidden;
        background: #000;
      }
      #container { 
        width: 100vw; 
        height: 100vh; 
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #loading {
        position: absolute;
        color: #0ff;
        font-family: 'Courier New', monospace;
        font-size: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="loading">Loading Void Navigator OS...</div>
    </div>

    <script type="module">
      try {
        // Initialize CheerpJ
        console.log("about to init");
        await cheerpjInit({ version: 17 });
        console.log("CheerpJ Java Version: " + System.getProperty("java.version"));
        console.log("init done");

        // Hide loading message
        document.getElementById('loading').style.display = 'none';
        
        // Create display
        cheerpjCreateDisplay(-1, -1, document.getElementById("container"));

        // Use GitHub raw URL
        const username = "catREADMEtxt";  // REPLACE THIS
        const repo = "AsteroidGame";      // REPLACE THIS
        const branch = "New-Features";    // REPLACE THIS
        
        const jarUrl = `AsteroidGame.jar`;
        console.log("jarUrl =", jarUrl);
        
        console.log("about to run jar");
        await cheerpjRunJar(jarUrl);
        console.log("jar launched");
      } catch (error) {
        document.getElementById('loading').innerHTML = 
          'Error loading game: ' + error.message + '<br>Please refresh the page.';
        console.error('CheerpJ error:', error);
      }
    </script>
  </body>
</html>
