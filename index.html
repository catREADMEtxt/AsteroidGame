<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AsteroidGame</title>
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <style>
      html, body { margin: 0; height: 100%; }
      #container { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <script type="module">
      await cheerpjInit();
      cheerpjCreateDisplay(-1, -1, document.getElementById("container"));

      // IMPORTANT: Use relative path so it works on GitHub Project Pages (/repo-name/)
      await cheerpjRunJar("AsteroidGame.jar");
    </script>
  </body>
</html>
